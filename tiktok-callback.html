<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion TikTok — Aarok Gaming Publisher</title>
<style>
 body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0f17;color:#f5f7fb;line-height:1.6}
 main{max-width:720px;margin:0 auto;padding:56px 20px}
 h1{font-size:26px;margin-bottom:6px}
 .muted{color:#a8b0bd;font-size:14px}
 .panel{border:1px solid #263244;background:#121826;border-radius:8px;padding:18px;margin-top:24px}
 code{display:block;background:#0b0f17;border:1px solid #2d3b52;border-radius:6px;
      padding:14px;margin-top:10px;word-break:break-all;color:#25f4ee;font-size:15px}
 button{margin-top:12px;background:#25f4ee;color:#0b0f17;border:0;border-radius:6px;
        padding:10px 18px;font-weight:bold;font-size:15px;cursor:pointer}
 .err{color:#ff8a8a}
</style>
</head>
<body>
<main>
<h1>Connexion TikTok</h1>
<p class="muted">Aarok Gaming Publisher — compte @aarok.tv</p>

<div class="panel" id="zone">
  <p>Lecture de la réponse de TikTok…</p>
</div>

<p class="muted" style="margin-top:28px">
Cette page reçoit la redirection d'autorisation TikTok. Elle n'enregistre rien
et ne transmet rien : le code reste dans ton navigateur.
</p>
</main>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var code = p.get("code");
  var err = p.get("error") || p.get("error_description");
  var z = document.getElementById("zone");

  if (code) {
    z.innerHTML =
      "<p><strong>Autorisation accordée.</strong> Copie ce code et colle-le dans l'outil :</p>" +
      "<code id=\"c\"></code>" +
      "<button id=\"b\">Copier le code</button>" +
      "<p class=\"muted\" style=\"margin-top:14px\">Ce code expire en quelques minutes.</p>";
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("b").textContent = "Copié";
      });
    };
  } else if (err) {
    z.innerHTML = "<p class=\"err\"><strong>TikTok a refusé l'autorisation.</strong></p>" +
                  "<code></code>";
    z.querySelector("code").textContent = err;
  } else {
    z.innerHTML = "<p class=\"muted\">Aucun code dans l'adresse. " +
                  "Relance la connexion depuis l'outil.</p>";
  }
})();
</script>
</body>
</html>
